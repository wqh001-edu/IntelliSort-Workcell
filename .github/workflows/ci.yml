name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ros-build:
    runs-on: ubuntu-22.04
    container: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y ros-humble-moveit ros-humble-ros2-control \
            ros-humble-ros2-controllers ros-humble-gazebo-ros-pkgs \
            ros-humble-gazebo-ros2-control python3-opencv
      - name: Colcon build
        run: |
          . /opt/ros/humble/setup.bash
          colcon build --symlink-install
